<svg xmlns="http://www.w3.org/2000/svg" width="303" height="166" viewBox="0 0 303 166">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd34e"/>
      <stop offset="55%" stop-color="#f4ad22"/>
      <stop offset="100%" stop-color="#d87a0d"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d43c58"/>
      <stop offset="60%" stop-color="#a8173b"/>
      <stop offset="100%" stop-color="#74122d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="1.6" flood-color="#24130e" flood-opacity=".65"/>
    </filter>
  </defs>

  <!-- decorative jungle leaves / splashes -->
  <g opacity=".95">
    <path d="M30 52c8-13 18-15 29-12-4 10-12 17-26 19z" fill="#238f5a"/>
    <path d="M42 63c10-12 20-14 29-9-6 9-15 14-28 13z" fill="#3fae67"/>
    <path d="M270 50c-8-12-18-15-29-11 4 10 12 17 26 18z" fill="#238f5a"/>
    <path d="M259 65c-9-13-19-15-29-10 5 9 15 15 28 14z" fill="#3fae67"/>
    <ellipse cx="28" cy="34" rx="8" ry="4" transform="rotate(-25 28 34)" fill="#e05b7c"/>
    <ellipse cx="278" cy="34" rx="8" ry="4" transform="rotate(24 278 34)" fill="#e05b7c"/>
    <ellipse cx="17" cy="74" rx="7" ry="4" transform="rotate(-35 17 74)" fill="#2e78bd"/>
    <ellipse cx="286" cy="74" rx="7" ry="4" transform="rotate(35 286 74)" fill="#2e78bd"/>
  </g>

  <!-- kids peeking from behind title -->
  <g stroke="#3a2017" stroke-width="1.8" filter="url(#shadow)">
    <!-- left -->
    <circle cx="92" cy="38" r="14" fill="#f0b18a"/>
    <path d="M79 33c4-13 23-15 28-1-5-4-10-4-14 0-4 4-8 3-14 1z" fill="#4f2f20"/>
    <path d="M82 28c2-7 7-10 13-10" fill="none" stroke="#4f2f20" stroke-linecap="round"/>
    <path d="M81 43c4 7 16 8 22 0v14H81z" fill="#56a748"/>
    <circle cx="87" cy="39" r="1.2" fill="#32221d"/>
    <circle cx="98" cy="39" r="1.2" fill="#32221d"/>
    <!-- center -->
    <circle cx="151" cy="28" r="17" fill="#edb087"/>
    <path d="M135 29c0-16 31-20 33-3-6-6-11-7-16-3-5 4-11 6-17 6z" fill="#9d5c2c"/>
    <circle cx="145" cy="28" r="1.4" fill="#2e201a"/>
    <circle cx="157" cy="28" r="1.4" fill="#2e201a"/>
    <path d="M146 34c4 3 8 3 12 0" fill="none" stroke="#7c392f" stroke-linecap="round"/>
    <path d="M136 42c8 7 23 7 31 0l2 18h-35z" fill="#de4350"/>
    <!-- right -->
    <circle cx="214" cy="39" r="14" fill="#f3bd94"/>
    <path d="M200 34c3-13 24-15 28-1-8-2-14-2-18 4-4 2-7 0-10-3z" fill="#e2b15c"/>
    <path d="M202 43c5 7 16 8 22 0v14h-22z" fill="#d987ba"/>
    <circle cx="208" cy="40" r="1.2" fill="#32221d"/>
    <circle cx="219" cy="40" r="1.2" fill="#32221d"/>
  </g>

  <!-- JUMANJI -->
  <g text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" filter="url(#shadow)">
    <text x="151.5" y="79" font-size="47" letter-spacing="-2.8"
          fill="url(#gold)" stroke="#432317" stroke-width="5" paint-order="stroke">
      JUMANJI
    </text>
    <text x="151.5" y="80" font-size="47" letter-spacing="-2.8"
          fill="none" stroke="#ffd85b" stroke-width="1.2" opacity=".75">
      JUMANJI
    </text>
  </g>

  <!-- Park -->
  <g text-anchor="middle" font-family="Trebuchet MS, Arial Rounded MT Bold, sans-serif" font-weight="900" filter="url(#shadow)">
    <text x="151.5" y="128" font-size="48" letter-spacing="-2.5"
          fill="url(#red)" stroke="#41131e" stroke-width="4.5" paint-order="stroke">
      Park
    </text>
    <text x="151.5" y="127" font-size="48" letter-spacing="-2.5"
          fill="none" stroke="#f05d72" stroke-width="1.2" opacity=".7">
      Park
    </text>
  </g>

  <!-- playful accent marks -->
  <g stroke="#4c281b" stroke-width="1.4">
    <ellipse cx="52" cy="112" rx="5" ry="2.6" transform="rotate(-28 52 112)" fill="#2e78bd"/>
    <ellipse cx="253" cy="111" rx="5" ry="2.6" transform="rotate(28 253 111)" fill="#2e78bd"/>
    <ellipse cx="67" cy="21" rx="4.5" ry="2.4" transform="rotate(-18 67 21)" fill="#2e78bd"/>
    <ellipse cx="236" cy="22" rx="4.5" ry="2.4" transform="rotate(18 236 22)" fill="#e05b7c"/>
  </g>
</svg>